[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-legacy"
version = "0.1.0"
description = "Agent-Legacy — Cost-aware multi-agent deep research framework that routes each job to the cheapest capable model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.0",
    "langgraph>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.6",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "textual>=0.86",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
